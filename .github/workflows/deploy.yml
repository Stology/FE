name: Frontend Deploy

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'FE/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            cd /home/ubuntu/stology-app/FE && git fetch origin
            cd /home/ubuntu/stology-app/FE && git checkout ${{ github.ref_name }}
            cd /home/ubuntu/stology-app/FE && git reset --hard origin/${{ github.ref_name }}

            cd /home/ubuntu/stology-app
            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "Deploying PRODUCTION frontend..."
              docker compose -f docker-compose.yml up -d --build frontend
            else
              echo "Deploying STAGING frontend..."
              docker compose -f docker-compose.staging.yml up -d --build frontend-staging
            fi
            
            docker image prune -f
